<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ed008c">
<title>Christmas Countdown | The Print Room</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
:root{--pink:#ed008c;--pink-dark:#97005a;--pink-deep:#4b002d;--gold:#e0bb35}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;position:relative;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff;text-align:center;background:radial-gradient(circle at top,#ff55b7 0%,var(--pink) 36%,var(--pink-dark) 72%,var(--pink-deep) 100%)}
.snow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}.snowflake{position:absolute;top:-30px;color:#fff;opacity:.85;user-select:none;pointer-events:none;text-shadow:0 0 6px rgba(255,255,255,.7);animation:snowfall linear infinite}@keyframes snowfall{0%{transform:translate3d(0,-10vh,0) rotate(0)}50%{transform:translate3d(var(--drift),50vh,0) rotate(180deg)}100%{transform:translate3d(calc(var(--drift)*-.5),110vh,0) rotate(360deg)}}
.christmas-display{position:relative;z-index:10;width:min(1180px,100%);display:grid;grid-template-columns:160px minmax(0,820px) 160px;gap:30px;align-items:center;justify-content:center}
.bauble-column{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:64px}.bauble{--bauble-colour:#fff;position:relative;width:145px;height:175px;display:flex;align-items:flex-end;justify-content:center;transform-origin:50% 0;animation:baubleSway 4.5s ease-in-out infinite;filter:drop-shadow(0 12px 14px rgba(58,0,35,.45))}.bauble:nth-child(2){animation-delay:-2.2s}.right-baubles .bauble:nth-child(1){animation-delay:-1.1s}.right-baubles .bauble:nth-child(2){animation-delay:-3.2s}@keyframes baubleSway{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
.bauble::before{content:"";position:absolute;top:0;left:50%;width:2px;height:34px;transform:translateX(-50%);background:linear-gradient(#fff,rgba(255,255,255,.35));box-shadow:0 0 6px rgba(255,255,255,.5)}.cap{position:absolute;top:29px;left:50%;width:36px;height:25px;transform:translateX(-50%);z-index:3;border-radius:7px 7px 4px 4px;border:2px solid rgba(255,255,255,.85);background:linear-gradient(90deg,#9f9f9f,#fff,#bababa,#fff,#8e8e8e);box-shadow:0 3px 5px rgba(64,0,38,.45)}.cap::before{content:"";position:absolute;width:15px;height:13px;left:50%;top:-11px;transform:translateX(-50%);border:3px solid #eee;border-bottom:0;border-radius:10px 10px 0 0}
.photo-frame{position:relative;width:145px;height:145px;overflow:hidden;border-radius:50%;border:7px solid var(--bauble-colour);background:#111;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),inset -10px -10px 20px rgba(0,0,0,.3),0 0 22px rgba(255,255,255,.30),0 12px 25px rgba(75,0,45,.45)}.photo-frame::after{content:"";position:absolute;top:11px;left:18px;width:40px;height:24px;border-radius:50%;background:rgba(255,255,255,.18);transform:rotate(-35deg);filter:blur(2px);pointer-events:none}.photo-frame img{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;object-position:center;transform:scale(1.02)}.pink{--bauble-colour:#ed008c}.white{--bauble-colour:#fff}
.countdown{position:relative;z-index:10;width:100%;padding:42px 30px;border:2px solid rgba(255,255,255,.35);border-radius:30px;background:rgba(90,0,53,.28);box-shadow:0 25px 70px rgba(67,0,40,.38);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.printroom-logo{display:block;width:clamp(145px,19vw,220px);height:auto;margin:0 auto 14px;border-radius:10px;box-shadow:0 9px 20px rgba(80,0,47,.25)}.tree{font-size:clamp(50px,7vw,86px);line-height:1;margin-bottom:8px}h1{margin:0 0 30px;font-size:clamp(32px,5vw,60px);text-shadow:0 4px 12px rgba(79,0,47,.42)}.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.unit{padding:22px 10px;border-radius:20px;border:1px solid rgba(255,255,255,.26);background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}.number{display:block;font-size:clamp(32px,6vw,68px);font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 5px 15px rgba(82,0,49,.4)}.label{display:block;margin-top:8px;font-size:clamp(12px,2vw,18px);text-transform:uppercase;letter-spacing:2px;opacity:.9}.message{margin-top:30px;font-size:clamp(20px,3vw,29px)}
@media(max-width:1050px){body{overflow-y:auto}.christmas-display{grid-template-columns:1fr;gap:18px;max-width:900px}.bauble-column{flex-direction:row;justify-content:center;gap:clamp(20px,8vw,75px)}.left-baubles{order:1}.countdown{order:2}.right-baubles{order:3}.bauble{width:120px;height:145px}.photo-frame{width:120px;height:120px}.cap{top:24px}}
@media(max-width:600px){body{padding:14px}.timer{grid-template-columns:repeat(2,1fr)}.countdown{padding:28px 18px}h1{margin-bottom:24px}.bauble-column{gap:18px}.bauble{width:92px;height:112px}.photo-frame{width:92px;height:92px;border-width:5px}.cap{top:20px;width:27px;height:19px}.bauble::before{height:25px}.message{margin-top:24px}.printroom-logo{width:150px}}
@media(prefers-reduced-motion:reduce){.snowflake,.bauble{animation:none}}
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>
<div class="christmas-display">
  <div class="bauble-column left-baubles">
    <div class="bauble white"><div class="cap"></div><div class="photo-frame"><img src="Jennifer Steel B&amp;W Crop 1.jpg" alt="Portrait bauble 1"></div></div>
    <div class="bauble pink"><div class="cap"></div><div class="photo-frame"><img src="Simon.jpeg" alt="Portrait bauble 2"></div></div>
  </div>
  <main class="countdown">
    <img src="printroom.jpeg" alt="The Print Room" class="printroom-logo">
    <div class="tree">🎄</div>
    <h1>Christmas Countdown</h1>
    <div class="timer">
      <div class="unit"><span class="number" id="days">0</span><span class="label">Days</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </div>
    <div class="message" id="message">Until Christmas! 🎅</div>
  </main>
  <div class="bauble-column right-baubles">
    <div class="bauble pink"><div class="cap"></div><div class="photo-frame"><img src="Colin 1.jpg" alt="Portrait bauble 3"></div></div>
    <div class="bauble white"><div class="cap"></div><div class="photo-frame"><img src="Saoirse Donnelly B&amp;W Crop 01 copy.jpg" alt="Portrait bauble 4"></div></div>
  </div>
</div>
<script>
function updateCountdown(){const now=new Date();let christmas=new Date(now.getFullYear(),11,25,0,0,0);if(now>christmas)christmas=new Date(now.getFullYear()+1,11,25,0,0,0);const difference=christmas-now;document.getElementById("days").textContent=Math.floor(difference/86400000);document.getElementById("hours").textContent=String(Math.floor(difference/3600000)%24).padStart(2,"0");document.getElementById("minutes").textContent=String(Math.floor(difference/60000)%60).padStart(2,"0");document.getElementById("seconds").textContent=String(Math.floor(difference/1000)%60).padStart(2,"0")}
function createSnow(){const c=document.getElementById("snow"),symbols=["❄","❅","❆","•"];for(let i=0;i<90;i++){const s=document.createElement("span");s.className="snowflake";s.textContent=symbols[Math.floor(Math.random()*symbols.length)];s.style.left=Math.random()*100+"vw";s.style.fontSize=7+Math.random()*18+"px";s.style.opacity=.3+Math.random()*.7;const d=7+Math.random()*13;s.style.animationDuration=d+"s";s.style.animationDelay=-(Math.random()*d)+"s";s.style.setProperty("--drift",(Math.random()*120-60)+"px");c.appendChild(s)}}
createSnow();updateCountdown();setInterval(updateCountdown,1000);
</script>
</body>
</html>
